# ForgeGradle 5.x hangs / misbehaves under JDK 21+ when resolving _compileJava_*.
# Point Gradle itself at a local JDK 17 (already downloaded by the toolchain).
org.gradle.java.home=C:/Users/elite/.gradle/jdks/jdk-17.0.17+10

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

# Fail faster on flaky Maven/Forge downloads instead of sitting forever
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000

# Java prefers IPv6; broken/filtered IPv6 to Cloudflare makes ForgeGradle hang forever
# on "Resolve dependencies of :forge19:_compileJava_1" (SYN_SENT, never connects).
systemProp.java.net.preferIPv4Stack=true
