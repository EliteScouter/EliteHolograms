# ForgeGradle 5.x hangs / misbehaves under JDK 21+ when resolving _compileJava_*.
# Point Gradle itself at a local JDK 17 (already downloaded by the toolchain).
org.gradle.java.home=C:/Users/elite/.gradle/jdks/jdk-17.0.17+10

# Java prefers IPv6 and this network has broken/filtered IPv6 to Cloudflare, which makes
# ForgeGradle stall for minutes per artifact on "Resolve dependencies of :forgeNN:_compileJava_1"
# (SYN_SENT, never connects). This MUST be a real -D JVM startup flag: the networking stack
# reads java.net.preferIPv4Stack during static init, so setting it via a `systemProp.` entry
# (which Gradle applies with System.setProperty() after the daemon is already up) is too late
# and has no effect. Moving it here is what actually takes the clean build from ~1h to minutes.
org.gradle.jvmargs=-Xmx4G -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false

org.gradle.daemon=true
org.gradle.caching=true

# 32 cores here and forge19/forge20 are independent, so build them concurrently.
org.gradle.parallel=true

# Fail faster on flaky Maven/Forge downloads instead of sitting forever.
# (These are read by Gradle's own HTTP client at use time, so systemProp. is fine for them.)
# 10s connect is generous for a live host and caps the damage if a declared repo ever
# goes dark again the way repo.aikar.co did (it black-holed SYNs: no RST, just silence,
# so every artifact that fell through to it burned the full connect timeout).
systemProp.org.gradle.internal.http.connectionTimeout=10000
systemProp.org.gradle.internal.http.socketTimeout=60000
