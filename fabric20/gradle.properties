# Fabric Loom 1.7.x is not compatible with Gradle 8.9+ (the Problems API it calls was
# removed) and requires at least 8.8, so this module pins the wrapper to exactly 8.8 rather
# than tracking the other modules. Gradle 8.8 also cannot run on Java 22+, hence the JDK 17
# pin below - the same JDK the root build uses.
org.gradle.java.home=C:/Users/elite/.gradle/jdks/jdk-17.0.17+10

# Gradle itself needs a JDK 17 for the 1.20.1 toolchain.
org.gradle.jvmargs=-Xmx4G -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true

# Fail faster on flaky Maven downloads instead of sitting forever.
systemProp.org.gradle.internal.http.connectionTimeout=10000
systemProp.org.gradle.internal.http.socketTimeout=60000

# https://fabricmc.net/develop/
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11
fabric_version=0.92.2+1.20.1

# The mod version. See https://semver.org/
mod_version=1.20.1-1.2.1
maven_group=com.strictgaming.elite.holograms
archives_base_name=EliteHolograms-Fabric
