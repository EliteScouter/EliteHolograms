plugins {
    id 'fabric-loom' version '1.7.4'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    // LuckPerms API
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
}

// Adventure is bundled into the jar. It is a plain library rather than a Fabric
// mod, so it goes through Shadow and then Loom's remapJar, instead of Loom's
// include() which expects nested mod jars.
configurations {
    shadowBundle
    implementation.extendsFrom shadowBundle
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Mojang official mappings, NOT Yarn. The other three editions are written
    // against Mojang names (ServerPlayer, getYRot, ClientboundAddEntityPacket),
    // so this keeps the ported sources identical to forge20 and makes future
    // changes portable between editions without renaming every symbol.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Minecraft already ships GSON, so it must not be bundled again.
    shadowBundle('net.kyori:adventure-text-minimessage:4.14.0') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    shadowBundle('net.kyori:adventure-text-serializer-gson:4.14.0') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    shadowBundle('net.kyori:adventure-text-serializer-legacy:4.14.0') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    // Provided by the server when LuckPerms is installed.
    compileOnly 'net.luckperms:api:5.4'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // Nothing here is a Fabric mod, so drop any stray module metadata.
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

// Remap the shaded jar rather than the plain one, so adventure ends up inside
// the published artifact.
remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
